<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeorgeOS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Pacifico&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="boot-overlay" id="boot-overlay" aria-hidden="true">
      <div class="boot-stars"></div>
      <div class="boot-core">
        <div class="boot-halo"></div>
        <p class="boot-logo">
          <span style="--i: 0">G</span><span style="--i: 1">e</span><span style="--i: 2">o</span><span style="--i: 3">r</span><span style="--i: 4">g</span><span style="--i: 5">e</span><span style="--i: 6">O</span><span style="--i: 7">S</span>
        </p>
        <div class="boot-progress"><span></span></div>
        <p class="boot-caption">Starting<i>.</i><i>.</i><i>.</i></p>
      </div>
      <div class="boot-flash"></div>
    </div>
    <main class="scene" aria-label="Welcome screen">
      <section class="view welcome-view" aria-label="Lock screen">
        <div class="welcome-clock" aria-live="polite">
          <p id="welcome-date" class="welcome-date">Friday, August 18</p>
          <p id="welcome-time" class="welcome-time">9:41</p>
        </div>
        <button class="bottom-button" type="button" aria-label="Enter desktop">
          <img class="user-avatar" src="default-avatar-profile-icon-of-social-media-user-vector.jpg" alt="" aria-hidden="true" />
          <span class="user-name">user</span>
          <span class="unlock-caption">Enter</span>
        </button>
      </section>

      <section class="view desktop-view" aria-label="Desktop screen" hidden>
        <div class="desktop-shell">
          <div class="device-frame">
            <div class="notch"></div>
            <div class="screen">
              <div class="desktop-wallpaper"></div>
              <aside class="desktop-widgets" aria-label="Desktop widgets">
                <section class="widget widget-clock" aria-label="Current time">
                  <p id="clock" class="widget-clock-time">9:41 AM</p>
                  <p id="widget-date" class="widget-clock-date">Friday, August 21</p>
                  <svg id="analog-clock" class="widget-analog-clock" viewBox="0 0 100 100" aria-hidden="true">
                    <circle cx="50" cy="50" r="46" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
                    <line id="analog-hour" x1="50" y1="50" x2="50" y2="30" stroke="rgba(255,255,255,0.92)" stroke-width="3.5" stroke-linecap="round" />
                    <line id="analog-minute" x1="50" y1="50" x2="50" y2="16" stroke="rgba(255,255,255,0.92)" stroke-width="2.5" stroke-linecap="round" />
                    <line id="analog-second" x1="50" y1="50" x2="50" y2="12" stroke="rgba(14,146,255,0.9)" stroke-width="1.2" stroke-linecap="round" />
                    <circle cx="50" cy="50" r="2.5" fill="rgba(255,255,255,0.92)" />
                  </svg>
                </section>
                <section class="widget widget-calendar" aria-label="Calendar">
                  <header class="widget-calendar-header">
                    <span id="calendar-month" class="widget-calendar-month">August</span>
                    <span id="calendar-year" class="widget-calendar-year">2026</span>
                  </header>
                  <div id="calendar-grid" class="widget-calendar-grid"></div>
                </section>
              </aside>

              <button class="workspace-pill" type="button" aria-label="Open workspaces overview" aria-haspopup="true">
                <span class="workspace-pill-dots" aria-hidden="true"></span>
                <span class="workspace-pill-label">1/4</span>
              </button>

              <div class="window-layer" aria-live="polite"></div>

              <div class="overview" hidden aria-label="Workspaces overview" role="dialog" aria-modal="true">
                <div class="overview-header">
                  <span class="overview-title">Workspaces</span>
                  <button type="button" class="overview-close">Done</button>
                </div>
                <div class="overview-grid" aria-label="Workspace overview"></div>
              </div>

              <nav class="taskbar" aria-label="Applications">
                <button class="taskbar-app" type="button" data-app="calculator" aria-label="Open Calculator">
                  <img src="icons/calculator-icon.svg" alt="" aria-hidden="true" />
                </button>
                <button class="taskbar-app" type="button" data-app="photos" aria-label="Open Photos">
                  <img src="icons/photos-icon.svg" alt="" aria-hidden="true" />
                </button>
                <button class="taskbar-app" type="button" data-app="paint" aria-label="Open Paint">
                  <img src="icons/OIP (16).webp" alt="" aria-hidden="true" />
                </button>
                <button class="taskbar-app" type="button" data-app="weather" aria-label="Open Weather">
                  <img src="icons/weather-icon.svg" alt="" aria-hidden="true" />
                </button>
                <button class="taskbar-app" type="button" data-app="camera" aria-label="Open Camera">
                  <img src="icons/camera-icon.svg" alt="" aria-hidden="true" />
                </button>
                <button class="taskbar-app" type="button" data-app="mail" aria-label="Open Mail">
                  <img src="icons/mail-icon.svg" alt="" aria-hidden="true" />
                </button>
                <button class="taskbar-app" type="button" data-app="projects" aria-label="Open Projects">
                  <img src="icons/github-icon.png" alt="" aria-hidden="true" />
                </button>
                <button class="taskbar-app" type="button" data-app="holy-moly" aria-label="Open Holy Moly">
                  <img src="icons/holy-moly-icon.png" alt="" aria-hidden="true" />
                </button>
                <button class="taskbar-app" type="button" data-app="linkedin" aria-label="Open LinkedIn">
                  <img src="icons/linkedin-icon.webp" alt="" aria-hidden="true" />
                </button>
                <button class="taskbar-app" type="button" data-app="youtube" aria-label="Open YouTube">
                  <img src="icons/R (5).png" alt="" aria-hidden="true" />
                </button>
                <button class="taskbar-app" type="button" data-app="instagram" aria-label="Open Instagram">
                  <img src="icons/OIP.jpg" alt="" aria-hidden="true" />
                </button>
                <button class="taskbar-app" type="button" data-app="system-breach" aria-label="Open System Breach">
                  <img src="icons/system-breach-icon.png" alt="" aria-hidden="true" />
                </button>
                <button class="taskbar-app" type="button" data-app="customize" aria-label="Open Customization">
                  <img src="icons/customize-icon.svg" alt="" aria-hidden="true" />
                </button>
                <button class="taskbar-app taskbar-mic" id="mic-button" type="button" data-state="off" aria-label="Toggle voice commands" title="Voice commands (Chrome/Edge only)">
                  <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="9" y="1" width="6" height="12" rx="3" />
                    <path d="M19 10v1a7 7 0 0 1-14 0v-1" />
                    <line x1="12" y1="18" x2="12" y2="23" />
                    <line x1="8" y1="23" x2="16" y2="23" />
                  </svg>
                </button>
              </nav>

              <aside class="todoist-widget" id="todoist-widget" aria-label="Todoist tasks">
                <header class="todoist-widget-header">
                  <span class="todoist-widget-title">Todoist</span>
                  <button
                    class="todoist-widget-icon-btn"
                    id="todoist-widget-refresh"
                    type="button"
                    aria-label="Refresh tasks"
                    title="Refresh tasks"
                  >↻</button>
                </header>
                <div class="todoist-widget-body" id="todoist-widget-body"></div>
              </aside>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
